<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تتبع طلبك</title>
  <meta name="description" content="اعرف طلبك وصل لأنهي مرحلة في التصنيع والشحن">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="brand" id="storeLink" href="/">تتبع الطلبات</a>
    </header>

    <h1>تتبع طلبك</h1>
    <p class="sub">اكتب رقم الطلب اللي وصلك بعد الشراء، وهتعرف طلبك في أنهي مرحلة.</p>

    <form class="card" id="trackForm" novalidate>
      <label for="orderInput">رقم الطلب</label>
      <div class="row">
        <input id="orderInput" name="order" inputmode="numeric" autocomplete="off" placeholder="مثلاً 10234" required>
        <button class="shrink" type="submit" id="trackBtn">تتبع</button>
      </div>
      <div class="error hidden" id="trackError" role="alert"></div>
    </form>

    <section class="card result hidden" id="result" aria-live="polite">
      <div class="hero" id="rHero">
        <div class="ring-wrap" aria-hidden="true">
          <svg class="ring" viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="44"></circle>
            <circle class="ring-fill" id="rRing" cx="50" cy="50" r="44"></circle>
          </svg>
          <div class="hero-icon" id="rIcon"></div>
          <div class="burst" id="rBurst"></div>
        </div>
        <div class="hero-text">
          <div class="meta">طلب رقم <span class="order-no" id="rNumber"></span></div>
          <div class="hero-stage" id="rStage"></div>
          <div class="hero-step" id="rStep"></div>
          <div class="meta" id="rProduct"></div>
        </div>
      </div>
      <ol class="timeline" id="rTimeline"></ol>
      <div class="note hidden" id="rNote"></div>
      <div class="meta updated" id="rUpdated"></div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script src="/track.js"></script>
</body>
</html>
